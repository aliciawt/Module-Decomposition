<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LycheeChat 💗</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="header">
        <h1>💗💗 LycheeChat 💗💗</h1>
    </div>

    <div id="chats-container">
        <!-- Someone else's message -->
        <div class="message message-other">
            <div class="message-username">PixelPrincess</div>
            <div class="message-text">Omg this chat is so cute!! 🍡</div>
            <div class="message-timestamp">7:42 PM</div>
        </div>

        <!-- User message -->
        <div class="message message-user">
            <div class="message-username">You</div>
            <div class="message-text">Right?? I love the pink vibes 💕</div>
            <div class="message-timestamp">7:43 PM</div>
        </div>

        <!-- Another person's message -->
        <div class="message message-other">
            <div class="message-username">LycheeKing</div>
            <div class="message-text">Has anyone tried the new bubble tea place?</div>
            <div class="message-timestamp">7:45 PM</div>
        </div>
    </div>

    <div id="typing-area">
        <textarea id="typing-box" placeholder="Type your message here..."></textarea>
        <button id="send-button">Send</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
